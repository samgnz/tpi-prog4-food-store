services:
  db:
    image: postgres:15
    container_name: tpi_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: tpi_db
    ports:
      - "5432:5432"
    volumes:
      - foodstore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  foodstore_postgres_data:

